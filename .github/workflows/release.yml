# Release (cut tag). The first half of the two-workflow chain. An operator runs this
# workflow from the Actions tab. The workflow computes the next calendar version from the
# tags that exist, pushes an annotated tag with the ordinary GITHUB_TOKEN, and then
# dispatches build-release.yml against that tag.
#
# A push with GITHUB_TOKEN does not fire the `push: tags` trigger of build-release.yml.
# GitHub suppresses an event from GITHUB_TOKEN to prevent a recursion. The explicit
# dispatch below is the normal path, so the chain never builds a tag two times.
#
# This workflow publishes nothing. The GitHub Release is made by build-release.yml.
name: Release (cut tag)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit-ish to release (branch, tag, or SHA). Defaults to the ref of this workflow run."
        required: false
        default: ""

# Never cut two releases at the same time. The count is max(existing tags) + 1, and a race
# could compute the same count two times.
concurrency:
  group: release-cut
  cancel-in-progress: false

# The workflow token is read-only. The one job that pushes the tag gets the write scopes.
permissions:
  contents: read

jobs:
  cut:
    name: Compute + tag + dispatch build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the annotated tag
      actions: write    # dispatch build-release.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The full history and all tags, so that cut_version.py can compute the count of
          # this week.
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.ref || github.ref }}
          # This job pushes the tag with the checkout credentials, so it keeps them. It runs
          # only Python from this repository and no third-party code.

      - name: Refuse a ref that is not on main
        # A release must contain only reviewed content. The input can name any branch, tag,
        # or SHA, so this step makes sure that the commit is main or an ancestor of main.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Refusing to cut a release: $(git rev-parse HEAD) is not on main."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Test the compute core
        run: python3 -m unittest discover -s scripts/tests

      - name: Configure git identity
        # An annotated tag records a tagger, so git needs an identity.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute + create tag
        id: cut
        run: python3 scripts/cut_version.py --tag --ref HEAD

      - name: Push tag
        # A push with GITHUB_TOKEN does not fire the `push: tags` trigger of build-release.yml.
        run: git push origin "${{ steps.cut.outputs.tag }}"

      - name: Dispatch build-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching build-release.yml for ${{ steps.cut.outputs.tag }}"
          gh workflow run build-release.yml --ref "${{ steps.cut.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Release cut"
            echo ""
            echo "- **Version:** \`${{ steps.cut.outputs.version }}\`"
            echo "- **Tag:** \`${{ steps.cut.outputs.tag }}\`"
            echo ""
            echo "build-release.yml dispatched against the tag."
          } >> "$GITHUB_STEP_SUMMARY"
