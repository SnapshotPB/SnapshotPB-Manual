[package]
name = "snapshotpb-manual"
version = "0.1.0"
edition = "2021"
description = "Generates the stand-alone HTML manual of a SnapshotPB board and its firmware"
license = "GPL-3.0-only"

[[bin]]
name = "snapshotpb-manual"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = 2
