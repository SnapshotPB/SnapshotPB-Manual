# The manual of the SnapshotPB Autococker: the Rev B board, its firmware, and the app.
#
# A path `name:rest` resolves against the source root `name` below. A path with no prefix is
# relative to this file. `~` is the home directory. `--source name=path` on the command line
# replaces a root. A media item of a document uses the same `name:rest` form for a file that
# another repository owns.

id = "autococker-rev-b"
title = "SnapshotPB Autococker Manual"
# The language of the manual. Each document holds its text in one or more languages, and a
# text that has no item in this language falls back to English. `--lang` replaces this value.
language = "en"
output = "../dist/snapshotpb-autococker-rev-b.html"
content = "../content/autococker-rev-b"

[sources]
pcb = "~/workspace/SnapshotPB-PCB"
app = "~/workspace/SnapshotPB"

[brand]
logo = "../assets/snapshotpb.svg"
emblem = "../assets/autococker-division.svg"
emblem_dark = "../assets/autococker-division-dark.svg"
icon = "../assets/favicon-plain.svg"
theme = "app:core/common/src/commonMain/kotlin/com/snapshotpb/configuration/common/theme/Color.kt"

# The name of the board as the manual prints it. The metrics file is a source path.
[board]
name = "Rev B"
metrics = "pcb:snapshot_v2/METRICS.json"

# The firmware document describes the firmware release: its controls, its screens, its
# settings, and its topics. It follows schemas/firmware/v2. The firmware repository writes it
# at each release and attaches it to the release, so the manual takes it from there: the
# release as owner/repository@tag, and the asset by name. The build verifies the asset
# against the digest of the release, and against `sha256` when the manifest pins one. A
# `document = "<path>"` member in the place of the release names a file instead.
[firmware]
release = "SnapshotPB/Firmware@v2026.41.1"
asset = "snapshot_reva-2026.41.1-manual-document.json"
sha256 = "579d44d6fe8b65e9594ee24a471450ef21265235842b9ab49ce540ce7bf587b5"

# The application document describes the app release for each target. It follows
# schemas/app/v2, and it uses the shared keys of the firmware document. The app repository
# attaches it to each release in the same way. Remove this table to build a manual of the
# board alone.
[app]
release = "SnapshotPB/Configuration-App@v26.41.2"
asset = "snapshotpb-app-26.41.2-manual-document.json"
sha256 = "3cef1d571052db1ef70914ea03e09758e858f68684f7f9822f2dda8debd1c68f"

# Literal values for `{{value name}}` in the chapters.
[values]
"product" = "SnapshotPB"

# The readable name of each designator that the board labels in short form. A chapter writes
# the designator in backticks, and the page shows the name with the designator after it, for
# example Trigger (TRIG). A label in a drawing shows the name alone. A board revision that
# prints the full name on the silk needs no entry.
[names]
"TRIG" = "Trigger"
"TRIG1" = "Trigger"
"J4" = "USB Header"
"J8" = "OLED Display Board"
"J11" = "Optical Trigger Board"
"J13" = "Microswitch Trigger Board"

# The link preview: the text and the picture that a chat app or a social site shows for a
# link to the manual. The page gets the Open Graph and Twitter tags of the website from it.
# The address of a page is `<site_url><id>/<lang>/`. Both addresses are absolute, because a
# crawler reads the page apart from its site. An `image = "https://…"` key names the picture
# of the preview, 1200 × 630 pixels. Without the key, the preview shows the SnapshotPB logo
# picture of the website. Remove this table to build a manual with no preview.
[social]
site_url = "https://snapshotpb.github.io/SnapshotPB-Manual/"
description = "Install, set up, and use the Cocker Board in your Autococker: the buttons, the screen, each firmware setting, and the SnapshotPB app."
